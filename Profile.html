<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - CineAI</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-left">
        <div class="logo" onclick="goHome()">
          <i class="fa-solid fa-play logo-icon"></i>
          <span>Cine<b>AI</b></span>
        </div>
        <nav class="nav-links">
          <a href="index.html"><i class="fa-solid fa-house"></i> HOME</a>
          <a href="#" id="navMovies" onclick="filterCategory('movie')">
            <i class="fa-solid fa-film"></i> MOVIES
          </a>
          <a href="#" id="navSeries" onclick="filterCategory('tv')">
            <i class="fa-solid fa-tv"></i> SERIES
          </a>
          <a href="#" id="navSearch" onclick="toggleSearchInput()">
            <i class="fa-solid fa-magnifying-glass"></i> SEARCH
          </a>
        </nav>
      </div>

      <div class="search-box" id="searchBox" style="display: none">
        <input
          type="text"
          id="searchInput"
          placeholder="Search movies or series..."
          onkeyup="handleSearch(event)"
        />
        <button onclick="executeSearch()">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>

      <div class="nav-right"></div>
    </header>

    <main class="profile-container">
      <div class="profile-card">
        <h1>My Profile</h1>
        <p class="profile-subtitle">
          Manage your watchlist and account settings
        </p>

        <div class="profile-section">
          <span class="label">LOGGED IN AS</span>
          <h2 id="profileUsername">Laster...</h2>
        </div>

        <div class="profile-section">
          <h2>My Watchlist</h2>
          <div class="movie-row" id="watchlistContainer"></div>
        </div>

        <div class="profile-actions">
          <button class="btn btn-info" onclick="goHome()">
            <i class="fa-solid fa-arrow-left"></i> Back to Home
          </button>
          <button class="btn btn-logout" onclick="handleLogout()">
            <i class="fa-solid fa-right-from-bracket"></i> Log Out
          </button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
